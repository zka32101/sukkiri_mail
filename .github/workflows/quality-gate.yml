name: Quality Gate (Code + Security)

# PR・pushでコード品質とセキュリティをチェック。
# - Dart: フォーマット、静的解析
# - TypeScript: ESLint、型チェック
# - Dependencies: 脆弱性スキャン
# - Secrets: 秘密鍵露出チェック

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  dart-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting (dart format)
        run: dart format --output none --set-exit-if-changed lib/ test/
        continue-on-error: true

  typescript-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint (ESLint)
        run: npm run lint

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .github/gitleaks.toml
        continue-on-error: true

  npm-security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Check npm dependencies for vulnerabilities
        run: npm audit --production --audit-level=moderate
        continue-on-error: true

  flutter-dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Flutter dependencies for outdated packages
        run: |
          # 依存パッケージの更新確認（ワーニングのみ）
          flutter pub outdated --no-prerelease || true
        continue-on-error: true

