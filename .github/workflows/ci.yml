name: Sukkiri Mail CI

# コスト最適化のためUbuntu上のanalyze/testのみをPR/push時の必須ゲートとする
# (feedback_ios_cicd_cost_optimization方針: 3段階ゲートのStep1に相当)。

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  functions-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: TypeScript build
        run: npm run build

      - name: Verify firebase-deploy.yml functions allowlist is in sync
        working-directory: .
        # firebase-deploy.ymlは、このFirebaseプロジェクトを共有する他アプリの関数を
        # 誤って削除しないよう、デプロイ対象のCloud Functions名を手動で列挙している
        # （詳細はfirebase-deploy.ymlのコメント参照）。関数を追加/削除したのに
        # このリストを更新し忘れると、デプロイは「成功」するが実際には何も
        # 反映されない（エラーにもならない）ため、PR/push時に必ず一致を検証する。
        run: |
          exported=$(grep -oP '(?<=^export const )\w+(?=\s*=\s*onCall)|(?<=^export \{ )\w+(?= \} from)' functions/src/index.ts | sort)
          deployed=$(grep -oP '(?<=functions:)\w+' .github/workflows/firebase-deploy.yml | sort)
          if [ "$exported" != "$deployed" ]; then
            echo "::error::functions/src/index.tsのexport済み関数と、firebase-deploy.ymlの" \
                 "デプロイ対象関数リストが一致していません。関数を追加/削除した場合は" \
                 "firebase-deploy.ymlのFUNCTIONS変数も更新してください。"
            echo "--- functions/src/index.ts で export されている関数 ---"
            echo "$exported"
            echo "--- firebase-deploy.yml のデプロイ対象関数 ---"
            echo "$deployed"
            exit 1
          fi
          echo "OK: 一致を確認しました。"
