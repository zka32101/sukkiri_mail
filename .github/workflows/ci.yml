name: Sukkiri Mail CI

# コスト最適化のためUbuntu上のanalyze/testのみをPR/push時の必須ゲートとする
# (feedback_ios_cicd_cost_optimization方針: 3段階ゲートのStep1に相当)。
#
# ワークフロー最適化:
# - キャッシング: npm/pub の依存関係キャッシュで高速化
# - 重複排除: firebase-deploy 検証を此処に統一（quality-gate.yml と重複排除）
# - テスト統一: Flutter/Functions テストを此処で実行

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  analyze-and-test-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib/ test/

      - name: Run unit/widget tests
        run: flutter test

  functions-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify firebase-deploy.yml functions allowlist is in sync
        working-directory: .
        # firebase-deploy.ymlは、このFirebaseプロジェクトを共有する他アプリの関数を
        # 誤って削除しないよう、デプロイ対象のCloud Functions名を手動で列挙している
        # 関数を追加/削除したのに此処を更新し忘れると、デプロイは「成功」するが
        # 実際には何も反映されない（エラーにもならない）ため、PR/push時に必ず検証する。
        run: |
          exported=$(grep -oP '(?<=^export const )\w+(?=\s*=\s*onCall)|(?<=^export \{ )\w+(?= \} from)' functions/src/index.ts | sort)
          deployed=$(grep -oP '(?<=functions:)\w+' .github/workflows/firebase-deploy.yml | sort)
          if [ "$exported" != "$deployed" ]; then
            echo "❌ ERROR: functions/src/index.ts のexport済み関数と"
            echo "firebase-deploy.yml のデプロイ対象関数リストが一致していません。"
            echo ""
            echo "--- functions/src/index.ts で export されている関数 ---"
            echo "$exported"
            echo ""
            echo "--- firebase-deploy.yml のデプロイ対象関数 ---"
            echo "$deployed"
            echo ""
            echo "関数を追加/削除した場合は firebase-deploy.yml の FUNCTIONS 変数も更新してください。"
            exit 1
          fi
          echo "✅ OK: Cloud Functions の一致を確認しました。"
