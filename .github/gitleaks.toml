# Gitleaks 設定
# リポジトリのコミット履歴から秘密鍵・認証情報などの露出をスキャン

title = "Sukkiri Mail - Gitleaks Configuration"

[allowlist]
  description = "Allowlist for known false positives"
  paths = [
    "pubspec.lock",
    "package-lock.json",
    "package.json",
    ".firebaserc",
  ]
  commits = []
  regexes = []

[[rules]]
  description = "Firebase API Key Detection (Sukkiri Mail)"
  id = "firebase-api-key"
  regex = '''firebase_app_id.*?:.*?"([A-Za-z0-9_-]{40,})"'''
  tags = ["firebase", "keys", "secrets"]
  keywords = ["firebase", "apiKey"]
  [[rules.allowlist]]
    description = "Allow Firebase config in public config files"
    paths = ["pubspec.yaml", "ios/Runner/GoogleService-Info.plist", "android/app/google-services.json"]

[[rules]]
  description = "Generic API Key / Secret Token"
  id = "generic-api-key"
  regex = '''(?i)(api[_-]?key|secret[_-]?key|access[_-]?token|auth[_-]?token)['\"]?\s*[:=]\s*['\"]([A-Za-z0-9_-]{32,})'''
  tags = ["api", "keys", "secrets"]
  keywords = ["api_key", "secret_key", "token"]

[[rules]]
  description = "Private Key Files"
  id = "private-key"
  regex = '''-----BEGIN (?:RSA|DSA|EC|OPENSSH|PGP) PRIVATE KEY'''
  tags = ["private", "keys"]
  keywords = ["BEGIN", "PRIVATE", "KEY"]
  [[rules.allowlist]]
    paths = ["docs/", "README.md", ".gitignore"]

[[rules]]
  description = "AWS Access Key ID"
  id = "aws-access-key"
  regex = '''(?i)(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AIKU|ASIA)[A-Z0-9]{16}'''
  tags = ["aws", "keys"]
  keywords = ["AKIA", "ASIA"]

[[rules]]
  description = "Google Cloud Platform API Key"
  id = "gcp-api-key"
  regex = '''AIza[0-9A-Za-z_-]{35}'''
  tags = ["gcp", "keys"]
  keywords = ["AIza"]
