name: sukkiri_mail
description: "受信箱に埋もれた「見なくていいメール」から人を解放するメール整理アプリ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.1.3

  # State management
  flutter_riverpod: ^2.5.1

  # Monetization
  purchases_flutter: ^8.2.3

  # OAuth (Gmail / Outlook)
  google_sign_in: ^6.2.2

  # Local storage (端末側キャッシュ管理)
  sqflite: ^2.3.3
  path_provider: ^2.1.4

  # Utilities
  shared_preferences: ^2.3.2
  intl: ^0.20.2
  uuid: ^4.5.1
  package_info_plus: ^8.1.0

  # UI / Animation
  flutter_animate: ^4.5.0
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  # TODO: Lottieアニメーション素材追加時に assets/lottie/ を作成しここへ登録する
  # （空ディレクトリをpubspecに登録するとFlutterのアセットバンドル時にエラーになるため、
  # 実ファイルが揃うまでは宣言しない）
